<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="/tools/video-downloader/youtube-downloader/style.css">
</head>
<body>

    <p class="error"></p>

    <div class="form" >
        <form>
            <input required id="url" type="text" placeholder="Enter YouTube video url">
            <button id="btn" type="submit">GO</button>
        </form>
    </div>
<div class="box hide">
    <div class="content">
        <h2>Title: <span class="description"></span></h2>
        <h3 class="">Author: <span class="author"></span></h3>
    </div>
    <div class="doptions">
        <h2>Download options</h2>
        <button><a class="music" target="_blank">Music only</a></button>
        <button><a class="original" target="_blank">Music & Video</a></button>
    </div>
</div>
    <div class="hide refresh"><button class="re_btn">Search another Video</button></div>
    <div class="load hide"><div class="loader"></div></div>
    <script src="/tools/video-downloader/youtube-downloader/script.js"></script>
</body>
